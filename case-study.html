<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Client Case Study</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Home"><img id="logoImage" alt=""><span id="brandName"></span></a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">Menu</button>
      <nav class="main-nav" id="mainNav"></nav>
      <div class="header-actions"><a class="button small" id="headerCta" href="index.html#contact"></a></div>
    </header>

    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <div><a href="index.html">Home</a><a href="index.html#stories">Customer stories</a><span id="caseBreadcrumb"></span></div>
    </nav>

    <main>
      <section class="case-hero" id="caseHero">
        <img id="caseImage" alt="">
        <div class="case-hero-copy">
          <span class="eyebrow">Client case</span>
          <h1 id="caseTitle"></h1>
          <p id="caseBrief"></p>
        </div>
      </section>
      <section class="case-content" id="caseContent">
        <div class="case-intro">
          <span class="eyebrow">Case intro</span>
          <h2 id="caseIntroTitle"></h2>
          <p id="caseIntroText"></p>
          <a class="button" href="index.html#contact">Request a demo</a>
        </div>
        <aside class="case-aside">
          <h3>Project focus</h3>
          <ul>
            <li>Operational visibility</li>
            <li>Process consistency</li>
            <li>Better data for decisions</li>
          </ul>
        </aside>
      </section>
    </main>

    <footer class="site-footer" id="footer">
      <div class="footer-brand"><h2 id="footerBrand"></h2><p id="footerText"></p></div>
      <div class="footer-columns" id="footerColumns"></div>
      <div class="footer-bottom"><span id="copyright"></span></div>
    </footer>

    <script src="site-data.js"></script>
    <script src="case-study.js"></script>
  </body>
</html>
