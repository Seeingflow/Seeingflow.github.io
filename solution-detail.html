<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solution</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Home"><img id="logoImage" alt=""><span id="brandName"></span></a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">Menu</button>
      <nav class="main-nav" id="mainNav"></nav>
      <div class="header-actions"><a class="button small" id="headerCta" href="index.html#contact"></a></div>
    </header>
    <nav class="breadcrumbs" aria-label="Breadcrumb"><div><a href="index.html">Home</a><a href="index.html#solutions">Solutions</a><span id="solutionBreadcrumb"></span></div></nav>
    <main>
      <section class="case-hero solution-detail-hero">
        <img id="solutionImage" alt="">
        <div class="case-hero-copy">
          <span class="eyebrow">Solution</span>
          <h1 id="solutionTitle"></h1>
          <p id="solutionSummary"></p>
        </div>
      </section>
      <section class="case-content">
        <div class="case-intro">
          <span class="eyebrow">Solution overview</span>
          <h2 id="solutionIntroTitle"></h2>
          <p id="solutionBody"></p>
          <a class="button" href="index.html#contact">Request a demo</a>
        </div>
        <aside class="case-aside">
          <h3>Relevant resources</h3>
          <div class="related-resource-list" id="relatedResources"></div>
        </aside>
      </section>
    </main>
    <footer class="site-footer" id="footer"><div class="footer-brand"><h2 id="footerBrand"></h2><p id="footerText"></p></div><div class="footer-columns" id="footerColumns"></div><div class="footer-bottom"><span id="copyright"></span></div></footer>
    <script src="site-data.js"></script>
    <script src="solution-detail.js"></script>
  </body>
</html>
